<script>
(function() {
try {
var t = localStorage.getItem('katran-theme') || localStorage.getItem('theme') || 'katran';
if (t === 'dark') t = 'katran';
if (t !== 'light' && t !== 'katran') t = 'katran';
document.documentElement.setAttribute('data-theme', t);
} catch (e) { document.documentElement.setAttribute('data-theme', 'katran'); }
})();
</script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
--bg: #0d0405;
--surface: var(--surface);
--line-soft: var(--line-soft);
--line-strong: var(--line-strong);
--inset: var(--inset);
--text: #f8ece8;
--muted: #c8a0a8;
--dim: #8a6068;
}
[data-theme="light"] {
--bg: #f4efe8;
--surface: rgba(0,0,0,0.02);
--line-soft: rgba(0,0,0,0.06);
--line-strong: rgba(0,0,0,0.12);
--inset: rgba(0,0,0,0.05);
--text: #0a0808;
--muted: #5a5450;
--dim: #8a8480;
}
body {
font-family: 'Inter', -apple-system, sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
padding: 2rem 1rem;
}
.container { max-width: 800px; margin: 0 auto; }
.top-bar {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 2rem;
flex-wrap: wrap;
gap: 1rem;
}
h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; }
h1 .red { color: #b04455; }
.back-link { color: var(--muted); text-decoration: none; font-size: 0.9rem; padding: 0.5rem 1rem; border: 1px solid var(--line-strong); border-radius: 60px; }
.back-link:hover { color: #b04455; border-color: #b04455; }
.tabs { display: flex; gap: 0.4rem; margin-bottom: 1.5rem; }
.tab {
background: transparent;
color: var(--muted);
border: 1px solid var(--line-strong);
padding: 0.5rem 1.2rem;
border-radius: 60px;
font-size: 0.85rem;
font-weight: 600;
cursor: pointer;
font-family: inherit;
}
.tab:hover { color: #b04455; background: rgba(176,68,85,0.08); }
.tab.active { background: #b04455; color: #fff; border-color: #b04455; }
.request-card {
background: var(--surface);
border: 1px solid var(--line-soft);
border-radius: 16px;
padding: 1.2rem;
margin-bottom: 0.8rem;
}
.request-header {
display: flex;
justify-content: space-between;
align-items: flex-start;
gap: 1rem;
margin-bottom: 0.6rem;
flex-wrap: wrap;
}
.request-title { font-weight: 700; font-size: 1rem; }
.request-author { color: var(--muted); font-size: 0.85rem; }
.request-note {
color: var(--muted);
font-size: 0.85rem;
background: var(--inset);
padding: 0.6rem 0.9rem;
border-radius: 8px;
border-left: 2px solid #b04455;
margin-top: 0.5rem;
line-height: 1.5;
}
.request-meta { font-size: 0.75rem; color: var(--dim); margin-top: 0.5rem; }
.request-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
.btn {
padding: 0.5rem 1.2rem;
border: none;
border-radius: 60px;
font-weight: 700;
font-size: 0.8rem;
cursor: pointer;
font-family: inherit;
}
.btn-approve { background: #2e7d32; color: #fff; }
.btn-approve:hover { background: #1b5e20; }
.btn-reject { background: transparent; color: #ff8a8a; border: 1px solid rgba(224,49,49,0.4); }
.btn-reject:hover { background: rgba(224,49,49,0.15); }
.status-badge {
display: inline-block;
padding: 0.25rem 0.7rem;
border-radius: 40px;
font-size: 0.7rem;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.05em;
}
.status-pending { background: rgba(255,193,7,0.15); color: #ffc107; }
.status-approved { background: rgba(76,175,80,0.15); color: #81c784; }
.status-rejected { background: rgba(224,49,49,0.15); color: #ff8a8a; }
.loading, .empty { text-align: center; padding: 3rem; color: var(--muted); }
.empty .flower { font-size: 2.5rem; color: #b04455; display: block; margin-bottom: 1rem; }
.error-msg {
background: rgba(224,49,49,0.15);
border: 1px solid rgba(224,49,49,0.4);
color: #ff8a8a;
padding: 1rem;
border-radius: 10px;
text-align: center;
margin-bottom: 1rem;
}
.theme-toggle {
position: fixed;
bottom: 1.2rem;
right: 1.2rem;
width: 46px;
height: 46px;
border-radius: 50%;
border: 2px solid #b04455;
background: var(--surface);
color: var(--text);
cursor: pointer;
z-index: 999;
display: flex;
align-items: center;
justify-content: center;
}
.theme-toggle svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var allRequests = [];
var activeTab = 'pending';
var currentUser = null;

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(dateStr) {
var d = new Date(dateStr);
var s = Math.floor((new Date() - d) / 1000);
if (s < 60) return 'şimdi';
if (s < 3600) return Math.floor(s/60) + ' dk önce';
if (s < 86400) return Math.floor(s/3600) + ' sa önce';
return Math.floor(s/86400) + ' gün önce';
}

(async function init() {
var sessionRes = await supabaseClient.auth.getSession();
if (!sessionRes.data.session) { window.location.href = 'giris.html'; return; }
currentUser = sessionRes.data.session.user;

// Admin kontrolü
var profRes = await supabaseClient.from('profiles').select('role').eq('id', currentUser.id).single();
if (!profRes.data || profRes.data.role !== 'admin') {
document.getElementById('loadingState').style.display = 'none';
document.getElementById('errorState').style.display = 'block';
document.getElementById('errorMsg').textContent = 'Bu sayfaya erişim yetkiniz yok.';
return;
}

await loadRequests();
document.getElementById('loadingState').style.display = 'none';
document.getElementById('content').style.display = 'block';

document.querySelectorAll('.tab').forEach(function(t) {
t.addEventListener('click', function() {
document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); });
this.classList.add('active');
activeTab = this.getAttribute('data-tab');
render();
});
});
})();

async function loadRequests() {
var res = await supabaseClient
.from('book_requests')
.select('*')
.order('created_at', { ascending: false });

if (res.error) {
console.error('Talep yükleme hatası:', res.error);
document.getElementById('listContainer').innerHTML = '<div class="empty">Talepler yüklenemedi. Bağlantını kontrol edip sayfayı yenile.</div>';
return;
}
allRequests = res.data || [];
render();
}

function render() {
var filtered = allRequests.filter(function(r) { return r.status === activeTab; });
var container = document.getElementById('listContainer');

if (!filtered.length) {
container.innerHTML = '<div class="empty"><span class="flower">❀</span>Bu bölümde talep yok.</div>';
return;
}

var html = '';
filtered.forEach(function(r) {
var badgeClass = 'status-' + r.status;
var badgeText = r.status === 'pending' ? 'Bekliyor' : r.status === 'approved' ? 'Onaylandı' : 'Reddedildi';

html += '<div class="request-card">';
html += '<div class="request-header">';
html += '<div>';
html += '<div class="request-title">' + escapeHtml(r.title) + '</div>';
if (r.author) html += '<div class="request-author">' + escapeHtml(r.author) + '</div>';
html += '</div>';
html += '<span class="status-badge ' + badgeClass + '">' + badgeText + '</span>';
html += '</div>';
if (r.note) html += '<div class="request-note">' + escapeHtml(r.note) + '</div>';
html += '<div class="request-meta">' + timeAgo(r.created_at) + '</div>';

if (r.status === 'pending') {
html += '<div class="request-actions">';
html += '<button class="btn btn-approve" onclick="setStatus(\'' + r.id + '\', \'approved\')">✓ Onayla</button>';
html += '<button class="btn btn-reject" onclick="setStatus(\'' + r.id + '\', \'rejected\')">✕ Reddet</button>';
html += '</div>';
}
html += '</div>';
});
container.innerHTML = html;
}

window.setStatus = async function(id, status) {
var res = await supabaseClient
.from('book_requests')
.update({ status: status, reviewed_at: new Date().toISOString(), reviewed_by: currentUser.id })
.eq('id', id);

if (res.error) { console.error('Durum güncelleme hatası:', res.error); alert('İşlem başarısız. Bağlantını kontrol edip tekrar dene.'); return; }

// Onaylanan talep kataloğa işlensin
if (status === 'approved') {
try {
var reqRes = await supabaseClient.from('book_requests').select('title, author').eq('id', id).single();
if (reqRes.data && reqRes.data.title) {
var exRes = await supabaseClient.from('books').select('id').eq('title', reqRes.data.title).limit(1);
if (!exRes.data || !exRes.data.length) {
var insRes = await supabaseClient.from('books').insert([{ title: reqRes.data.title, author: reqRes.data.author || null }]);
if (insRes.error) console.error('Katalog ekleme hatası:', insRes.error);
}
}
} catch (e) { console.error('Katalog ekleme hatası:', e); }
}
await loadRequests();
};
})();
</script>

<script>
(function() {
'use strict';
var MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
var SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
function readTheme() {
try {
var t = localStorage.getItem('katran-theme') || localStorage.getItem('theme') || 'katran';
if (t === 'dark') t = 'katran';
return (t === 'light') ? 'light' : 'katran';
} catch (e) { return 'katran'; }
}
function writeTheme(v) {
try { localStorage.setItem('katran-theme', v); localStorage.setItem('theme', v); }
catch (e) {}
}
var html = document.documentElement;
var btn = document.getElementById('themeToggle');
if (!btn) return;
if (readTheme() !== 'light') { html.setAttribute('data-theme', 'katran'); btn.innerHTML = MOON; }
btn.addEventListener('click', function() {
var isKatran = html.getAttribute('data-theme') !== 'light';
if (isKatran) { html.setAttribute('data-theme', 'light'); writeTheme('light'); this.innerHTML = SUN; }
else { html.setAttribute('data-theme', 'katran'); writeTheme('katran'); this.innerHTML = MOON; }
});
})();
</script>

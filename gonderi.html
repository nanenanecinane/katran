<meta charset="utf-8"/>
<script>
(function() {
try {
var t = localStorage.getItem('katran-theme') || localStorage.getItem('theme') || 'katran';
if (t === 'dark') t = 'katran';
if (t !== 'light' && t !== 'katran') t = 'katran';
document.documentElement.setAttribute('data-theme', t);
} catch (e) { document.documentElement.setAttribute('data-theme', 'katran'); }
})();
</script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
--bg: #0d0405;
--surface: rgba(255,255,255,0.03);
--surface-input: rgba(255,255,255,0.04);
--line: rgba(255,255,255,0.08);
--line-strong: rgba(255,255,255,0.1);
--text: #f8ece8;
--muted: #c8a0a8;
}
[data-theme="light"] {
--bg: #f4efe8;
--surface: rgba(0,0,0,0.02);
--surface-input: #ffffff;
--line: rgba(0,0,0,0.1);
--line-strong: rgba(0,0,0,0.12);
--text: #0a0808;
--muted: #5a5450;
}
body {
font-family: 'Inter', -apple-system, sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
padding: 2rem 1rem;
}
.container { max-width: 600px; margin: 0 auto; }
.top-bar {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 2rem;
}
.back-link {
color: var(--muted);
text-decoration: none;
font-size: 0.9rem;
display: inline-flex;
align-items: center;
gap: 0.4rem;
}
.back-link svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.back-link:hover { color: #e03131; }
h1 {
font-family: 'Playfair Display', serif;
font-size: 1.6rem;
font-weight: 900;
}
.card {
background: var(--surface);
border: 1px solid var(--line);
border-radius: 20px;
padding: 2rem;
}
textarea {
width: 100%;
min-height: 200px;
background: var(--surface-input);
border: 1px solid var(--line);
border-radius: 12px;
padding: 1.2rem;
color: var(--text);
font-family: inherit;
font-size: 1rem;
line-height: 1.7;
resize: vertical;
}
textarea:focus { outline: none; border-color: #e03131; }
.char-count {
text-align: right;
color: var(--muted);
font-size: 0.8rem;
margin-top: 0.5rem;
}
.char-count.warn { color: #ffc107; }
.char-count.danger { color: #e03131; }
.btn-row {
display: flex;
justify-content: flex-end;
gap: 0.5rem;
margin-top: 1.5rem;
}
.btn {
padding: 0.8rem 1.8rem;
border-radius: 60px;
border: none;
font-weight: 700;
font-size: 0.9rem;
cursor: pointer;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 0.5rem;
}
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.btn-primary {
background: #e03131;
color: #f4efe8;
}
.btn-primary:hover { background: #b71c1c; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-cancel {
background: transparent;
color: var(--muted);
border: 1px solid var(--line-strong);
}
.btn-cancel:hover { color: #e03131; border-color: #e03131; }
.message {
padding: 1rem;
border-radius: 10px;
margin-bottom: 1.5rem;
display: none;
font-size: 0.9rem;
align-items: center;
gap: 0.5rem;
}
.message svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.message.error { background: rgba(224,49,49,0.15); border: 1px solid rgba(224,49,49,0.4); color: #ff8a8a; display: flex; }
.message.info { background: rgba(76,175,80,0.1); border: 1px solid rgba(76,175,80,0.3); color: #a5d6a7; display: flex; }
.loading { text-align: center; padding: 3rem; color: var(--muted); }
.theme-toggle {
position: fixed;
bottom: 1.2rem;
right: 1.2rem;
width: 46px;
height: 46px;
border-radius: 50%;
border: 2px solid #e03131;
background: var(--surface-input);
color: var(--text);
cursor: pointer;
z-index: 999;
display: flex;
align-items: center;
justify-content: center;
}
.theme-toggle svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>

<script>
/* Erken avatar: onbellekten eszamanli bas (ilk boyadan once) */
(function() {
  try {
    var p = JSON.parse(localStorage.getItem('katran-auth-cache') || 'null');
    if (!p || (!p.full_name && !p.username)) return;
    if (!window.renderAvatar) return;
    var link = document.getElementById('authLink');
    if (!link) return;
    var name = p.full_name || p.username;
    link.href = 'profil.html';
    link.title = name;
    link.innerHTML = window.renderAvatar(p, 36);
    link.classList.remove('avatar-login-btn');
    var box = document.getElementById('authContainer');
    if (box) box.classList.add('auth-ready');
  } catch (e) {}
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// İkonlar
var ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
var ICON_ERROR = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';

var contentEl = document.getElementById('content');
var charCount = document.getElementById('charCount');
var message = document.getElementById('message');
var submitBtn = document.getElementById('submitBtn');

function showMessage(msg, type) {
message.className = 'message ' + type;
message.innerHTML = (type === 'error' ? ICON_ERROR : ICON_CHECK) + '<span>' + msg + '</span>';
}

contentEl.addEventListener('input', function() {
var len = contentEl.value.length;
charCount.textContent = len + ' / 1000';
charCount.className = 'char-count';
if (len > 900) charCount.classList.add('danger');
else if (len > 800) charCount.classList.add('warn');
});

submitBtn.addEventListener('click', async function() {
var content = contentEl.value.trim();

if (!content) { showMessage('İçerik boş olamaz.', 'error'); return; }
if (content.length < 1) { showMessage('En az 1 karakter yaz.', 'error'); return; }

submitBtn.disabled = true;
submitBtn.textContent = 'Paylaşılıyor...';
message.style.display = '';

var sessionRes = await supabaseClient.auth.getSession();
var session = sessionRes.data.session;
if (!session) {
showMessage('Giriş yapmalısın.', 'error');
submitBtn.disabled = false;
submitBtn.textContent = 'Paylaş';
setTimeout(function() { window.location.href = 'giris.html'; }, 1500);
return;
}

var res = await supabaseClient.from('posts').insert([{
user_id: session.user.id,
content: content
}]);

if (res.error) {
console.error('Gönderi paylaşım hatası:', res.error);
showMessage('Paylaşım gönderilemedi. Bağlantını kontrol edip tekrar dene.', 'error');
submitBtn.disabled = false;
submitBtn.textContent = 'Paylaş';
return;
}

showMessage('Gönderin paylaşıldı! Akışa yönlendiriliyorsun...', 'info');
setTimeout(function() { window.location.href = 'akis.html'; }, 1000);
});

(async function init() {
var sessionRes = await supabaseClient.auth.getSession();
var session = sessionRes.data.session;

if (!session) {
window.location.href = 'giris.html';
return;
}

var profRes = await supabaseClient
.from('profiles')
.select('status')
.eq('id', session.user.id)
.single();

if (!profRes.data || profRes.data.status !== 'approved') {
document.getElementById('loadingState').innerHTML = 'Hesabın onaylı değil. <a href="giris.html" style="color:#e03131;">Girişe dön</a>';
return;
}

document.getElementById('loadingState').style.display = 'none';
document.getElementById('formContent').style.display = 'block';
contentEl.focus();
})();

})();
</script>

<script>
(function() {
'use strict';
var MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
var SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
function readTheme() {
try {
var t = localStorage.getItem('katran-theme') || localStorage.getItem('theme') || 'katran';
if (t === 'dark') t = 'katran';
return (t === 'light') ? 'light' : 'katran';
} catch (e) { return 'katran'; }
}
function writeTheme(v) {
try { localStorage.setItem('katran-theme', v); localStorage.setItem('theme', v); }
catch (e) {}
}
var html = document.documentElement;
var btn = document.getElementById('themeToggle');
if (!btn) return;
if (readTheme() !== 'light') { html.setAttribute('data-theme', 'katran'); btn.innerHTML = MOON; }
btn.addEventListener('click', function() {
var isKatran = html.getAttribute('data-theme') !== 'light';
if (isKatran) { html.setAttribute('data-theme', 'light'); writeTheme('light'); this.innerHTML = SUN; }
else { html.setAttribute('data-theme', 'katran'); writeTheme('katran'); this.innerHTML = MOON; }
});
})();
</script>

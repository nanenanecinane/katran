* { margin: 0; padding: 0; box-sizing: border-box; }
:root {

}
[data-theme="light"] {

<script>
(function() {
'use strict';
var MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
var SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
function readTheme() {
try {
var t = localStorage.getItem('katran-theme') || localStorage.getItem('theme') || 'katran';
if (t === 'dark') t = 'katran';
return (t === 'light') ? 'light' : 'katran';
} catch (e) { return 'katran'; }
}
function writeTheme(v) {
try { localStorage.setItem('katran-theme', v); localStorage.setItem('theme', v); }
catch (e) {}
}
var html = document.documentElement;
var btn = document.getElementById('themeToggle');
if (!btn) return;
if (readTheme() !== 'light') { html.setAttribute('data-theme', 'katran'); btn.innerHTML = MOON; }
btn.addEventListener('click', function() {
var isKatran = html.getAttribute('data-theme') !== 'light';
if (isKatran) { html.setAttribute('data-theme', 'light'); writeTheme('light'); this.innerHTML = SUN; }
else { html.setAttribute('data-theme', 'katran'); writeTheme('katran'); this.innerHTML = MOON; }
});
})();
</script>

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(dateStr) {
var d = new Date(dateStr);
var s = Math.floor((new Date() - d) / 1000);
if (s < 60) return 'şimdi';
if (s < 3600) return Math.floor(s/60) + ' dk önce';
if (s < 86400) return Math.floor(s/3600) + ' sa önce';
if (s < 604800) return Math.floor(s/86400) + ' gün önce';
return d.toLocaleDateString('tr-TR');
}

function toast(msg, isError) {

t.className = 'toast show' + (isError ? ' error' : '');

}

// ---------- BAŞLAT ----------
(async function init() {
var sessionRes = await supabaseClient.auth.getSession();
var session = sessionRes.data.session;

if (!session) {
window.location.href = 'giris.html';
return;
}
currentUser = session.user;

var profRes = await supabaseClient
.from('profiles')
.select('role, status, full_name')
.eq('id', currentUser.id)
.single();

if (profRes.error || !profRes.data) {
showError('Profil bilgisi alınamadı.');
return;
}

if (profRes.data.role !== 'admin') {
showError('Bu sayfaya erişim yetkiniz yok. Sadece admin kullanabilir.');
return;
}

document.getElementById('loadingState').style.display = 'none';
document.getElementById('content').style.display = 'block';

document.getElementById('logoutBtn').addEventListener('click', async function() {
await supabaseClient.auth.signOut();
try { localStorage.removeItem('katran-auth-cache'); } catch (e) {}
window.location.href = 'index.html';
});

document.querySelectorAll('.tab').forEach(function(t) {
t.addEventListener('click', function() {
document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); });
this.classList.add('active');
activeTab = this.getAttribute('data-tab');
loadTab();
});
});

// Derin bağlantı: ?tab=bookRequests gibi
try {
var tabParam = new URLSearchParams(window.location.search).get('tab');
if (tabParam) {
var tabBtn = document.querySelector('.tab[data-tab="' + tabParam + '"]');
if (tabBtn) {
document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); });
tabBtn.classList.add('active');
activeTab = tabParam;
}
}
} catch (e) {}

// Sayaçları güncelle
await updateCounts();
loadTab();
})();

function showError(msg) {
document.getElementById('loadingState').style.display = 'none';
document.getElementById('errorState').style.display = 'block';
document.getElementById('errorMsg').textContent = msg;
}

async function updateCounts() {
// Bekleyen başvuru sayısı
var appRes = await supabaseClient
.from('applications')
.select('id', { count: 'exact', head: true })
.or('status.is.null,status.eq.pending');

if (appRes.count > 0) {
var c1 = document.getElementById('countApplications');
c1.textContent = appRes.count;
c1.style.display = 'inline-block';
}

// Bekleyen kitap talebi sayısı
var brRes = await supabaseClient
.from('book_requests')
.select('id', { count: 'exact', head: true })
.eq('status', 'pending');

if (brRes.count > 0) {
var c2 = document.getElementById('countBookRequests');
c2.textContent = brRes.count;
c2.style.display = 'inline-block';
}
}

function loadTab() {
var c = document.getElementById('tabContent');
c.innerHTML = '<div class="loading">Yükleniyor...</div>';

if (activeTab === 'applications') loadApplications();
else if (activeTab === 'members') loadMembers();
else if (activeTab === 'bookRequests') loadBookRequests();
}

// ---------- BAŞVURULAR ----------
async function loadApplications() {
var res = await supabaseClient
.from('applications')
.select('*')
.order('created_at', { ascending: false })
.limit(100);

if (res.error) {
document.getElementById('tabContent').innerHTML =
'<div class="error-msg">Hata: ' + escapeHtml(res.error.message) + '</div>';
return;
}

var apps = res.data || [];

if (!apps.length) {
document.getElementById('tabContent').innerHTML =
'<div class="section"><div class="empty"><span class="flower">❀</span>Henüz başvuru yok.</div></div>';
return;
}

// Bekleyenler üstte
apps.sort(function(a, b) {
var aPending = !a.status || a.status === 'pending';
var bPending = !b.status || b.status === 'pending';
if (aPending && !bPending) return -1;
if (!aPending && bPending) return 1;
return 0;
});

var html = '<div class="section"><h2>Üye Başvuruları</h2>';
apps.forEach(function(app) {
var status = app.status || 'pending';
var badgeClass = status === 'approved' ? 'badge-approved' :
status === 'rejected' ? 'badge-rejected' : 'badge-pending';
var badgeText = status === 'approved' ? 'Onaylı' :
status === 'rejected' ? 'Reddedildi' : 'Bekliyor';

html += '<div class="item">';
html += '<div class="item-header">';
html += '<div>';
html += '<div class="item-name">' + escapeHtml(app.full_name || 'İsimsiz') + '</div>';
html += '<div class="item-username">@' + escapeHtml(app.username || 'kullanici') + '</div>';
html += '<div class="item-meta">' + escapeHtml(app.email) + ' · ' + timeAgo(app.created_at) + '</div>';
html += '</div>';
html += '<span class="badge ' + badgeClass + '">' + badgeText + '</span>';
html += '</div>';

if (app.reason) {
html += '<div class="item-reason">' + escapeHtml(app.reason) + '</div>';
}

if (status === 'pending') {
html += '<div class="item-actions">';
html += '<button class="btn btn-approve" onclick="approveApplication(\'' + app.id + '\')">' + ICONS.check + ' Onayla</button>';
html += '<button class="btn btn-reject" onclick="rejectApplication(\'' + app.id + '\')">' + ICONS.x + ' Reddet</button>';
html += '</div>';
} else if (status === 'rejected') {
html += '<div class="item-actions">';
html += '<button class="btn btn-neutral" onclick="unrejectApplication(\'' + app.id + '\')">↩ Geri Al</button>';
html += '</div>';
}

html += '</div>';
});
html += '</div>';
document.getElementById('tabContent').innerHTML = html;
}

// Başvuruyu onayla
window.approveApplication = async function(appId) {
if (!confirm('Bu başvuruyu onaylamak istediğine emin misin?')) return;

// Başvuruyu al
var res = await supabaseClient.from('applications').select('*').eq('id', appId).single();
if (res.error || !res.data) { toast('Başvuru bulunamadı', true); return; }
var app = res.data;

// applications.status = approved
await supabaseClient.from('applications').update({ status: 'approved' }).eq('id', appId);

// profiles'da bu email var mı?
var profRes = await supabaseClient.from('profiles').select('id, status').eq('email', app.email).single();

if (profRes.data) {
// Var → status approved yap
await supabaseClient.from('profiles').update({ status: 'approved' }).eq('id', profRes.data.id);
toast('Onaylandı!');
} else {
// Yok → trigger ile zaten eklenmiş olması lazım, ama güvenlik için ekle
toast('Onaylandı ancak profil kaydı bulunamadı', true);
}

await updateCounts();
loadApplications();
};

// Başvuruyu reddet
window.rejectApplication = async function(appId) {
if (!confirm('Bu başvuruyu reddetmek istediğine emin misin?')) return;

var res = await supabaseClient.from('applications').update({ status: 'rejected' }).eq('id', appId);
if (res.error) { toast('Hata: ' + res.error.message, true); return; }

// NOT: profil satırı 'pending' kalır (şema reddedildi durumunu profilde tutmaz);
// kişi giriş yapamaz, yazamaz; Geri Al ile sıra eski haline döner.
toast('Reddedildi');
await updateCounts();
loadApplications();
};

// ---------- ÜYELER ----------
async function loadMembers() {
var res = await supabaseClient
.from('profiles')
.select('*')
.order('created_at', { ascending: false })
.limit(200);

if (res.error) {
document.getElementById('tabContent').innerHTML =
'<div class="error-msg">Hata: ' + escapeHtml(res.error.message) + '</div>';
return;
}

var members = res.data || [];

if (!members.length) {
document.getElementById('tabContent').innerHTML =
'<div class="section"><div class="empty"><span class="flower">❀</span>Üye yok.</div></div>';
return;
}

// İstatistik: kaç onaylı, kaç pending
var approved = members.filter(function(m) { return m.status === 'approved'; }).length;
var pending = members.filter(function(m) { return m.status === 'pending'; }).length;
var banned = members.filter(function(m) { return m.status === 'banned'; }).length;

var html = '<div class="section"><h2>Üyeler</h2>';
html += '<p style="color:var(--muted);font-size:0.85rem;margin-bottom:1.2rem;">Toplam: ' + members.length + ' · Onaylı: ' + approved + ' · Bekleyen: ' + pending + ' · Yasaklı: ' + banned + '</p>';

members.forEach(function(m) {
var status = m.status || 'pending';
var badgeClass = status === 'approved' ? 'badge-approved' :
status === 'banned' ? 'badge-banned' : 'badge-pending';
var badgeText = status === 'approved' ? 'Onaylı' :
status === 'banned' ? 'Yasaklı' : 'Bekliyor';

var rank = m.rank || 'filiz';
var rankLabel = rank === 'katran' ? 'Katran Kurucusu' :
rank === 'gergedan' ? 'Gergedan Böceği' :
rank === 'karanfil' ? 'Karanfil' : 'Filiz';

html += '<div class="item">';
html += '<div class="item-header">';
html += '<div>';
html += '<div class="item-name">' + escapeHtml(m.full_name || 'İsimsiz') + '</div>';
html += '<div class="item-username">@' + escapeHtml(m.username || 'kullanici') + '</div>';
html += '<div class="item-meta">' + escapeHtml(m.email) + ' · ' + timeAgo(m.created_at) + '</div>';
html += '</div>';
html += '<div style="display:flex;flex-direction:column;gap:0.4rem;align-items:flex-end;">';
html += '<span class="badge ' + badgeClass + '">' + badgeText + '</span>';
html += '<span class="rank-pill rank-' + rank + '">' + rankLabel + '</span>';
if (m.role === 'admin') html += '<span class="badge badge-admin">Admin</span>';
html += '</div>';
html += '</div>';

if (status === 'pending') {
html += '<div class="item-actions">';
html += '<button class="btn btn-approve" onclick="approveMember(\'' + m.id + '\')">' + ICONS.check + ' Onayla</button>';
html += '<button class="btn btn-reject" onclick="rejectMember(\'' + m.id + '\')">' + ICONS.x + ' Reddet</button>';
html += '</div>';
} else if (status === 'approved') {
html += '<div class="item-actions">';
html += '<button class="btn btn-neutral" onclick="toggleAdmin(\'' + m.id + '\', \'' + (m.role || 'member') + '\')">' + ICONS.crown + ' ' + (m.role === 'admin' ? 'Adminliği Kaldır' : 'Admin Yap') + '</button>';
html += '<button class="btn btn-reject" onclick="banMember(\'' + m.id + '\')">' + ICONS.x + ' Yasakla</button>';
html += '</div>';
} else if (status === 'banned') {
html += '<div class="item-actions">';
html += '<button class="btn btn-neutral" onclick="unbanMember(\'' + m.id + '\')">↩ Yasağı Kaldır</button>';
html += '</div>';
}

html += '</div>';
});
html += '</div>';
document.getElementById('tabContent').innerHTML = html;
}

window.approveMember = async function(id) {
var r1 = await supabaseClient.from('profiles').update({ status: 'approved', approved_by: currentUser.id }).eq('id', id);
if (r1.error) { toast('Hata: ' + r1.error.message, true); return; }
var emailRes = await supabaseClient.from('profiles').select('email').eq('id', id).single();
if (emailRes.data) {
await supabaseClient.from('applications').update({ status: 'approved' }).eq('email', emailRes.data.email);
}
toast('Onaylandı');
await updateCounts();
loadMembers();
};

window.rejectMember = async function(id) {
if (!confirm('Bu üyenin başvurusunu reddetmek istiyor musun? Profili beklemede kalır, giriş yapamaz.')) return;
var emailRes = await supabaseClient.from('profiles').select('email').eq('id', id).single();
if (!emailRes.data) { toast('Profil bulunamadı', true); return; }
var res = await supabaseClient.from('applications').update({ status: 'rejected' }).eq('email', emailRes.data.email);
if (res.error) { toast('Hata: ' + res.error.message, true); return; }
toast('Reddedildi');
await updateCounts();
loadMembers();
};

window.toggleAdmin = async function(id, currentRole) {
if (id === currentUser.id) { toast('Kendi yetkini değiştiremezsin.', true); return; }
var newRole = currentRole === 'admin' ? 'member' : 'admin';
if (!confirm(newRole === 'admin' ? 'Bu kullanıcıyı admin yapmak istediğine emin misin?' : 'Adminliğini kaldırmak istediğine emin misin?')) return;
await supabaseClient.from('profiles').update({ role: newRole }).eq('id', id);
toast(newRole === 'admin' ? 'Admin yapıldı' : 'Adminlik kaldırıldı');
loadMembers();
};

// Üyeyi yasakla (onaylı → yasaklı)
window.banMember = async function(id) {
if (id === currentUser.id) { toast('Kendini yasaklayamazsın.', true); return; }
if (!confirm('Bu üyeyi yasaklamak istediğine emin misin? Girişi kapanacak.')) return;
var res = await supabaseClient.from('profiles').update({ status: 'banned' }).eq('id', id);
if (res.error) { toast('Hata: ' + res.error.message, true); return; }
toast('Üye yasaklandı');
await updateCounts();
loadMembers();
};

// Yasağı kaldır (yasaklı → onaylı)
window.unbanMember = async function(id) {
if (!confirm('Bu üyenin yasağını kaldırıp üyeliğe geri almak istiyor musun?')) return;
var res = await supabaseClient.from('profiles').update({ status: 'approved' }).eq('id', id);
if (res.error) { toast('Hata: ' + res.error.message, true); return; }
toast('Yasak kaldırıldı, üye aktif');
await updateCounts();
loadMembers();
};

// Reddedilen başvuruyu geri al (reddedildi → bekliyor)
window.unrejectApplication = async function(appId) {
if (!confirm('Bu başvuruyu tekrar inceleme sırasına almak istiyor musun?')) return;
var res = await supabaseClient.from('applications').update({ status: 'pending' }).eq('id', appId);
if (res.error) { toast('Hata: ' + res.error.message, true); return; }
var appRes = await supabaseClient.from('applications').select('email').eq('id', appId).single();
if (appRes.data) {
await supabaseClient.from('profiles').update({ status: 'pending' }).eq('email', appRes.data.email);
}
toast('Başvuru bekleyenlere alındı');
await updateCounts();
loadApplications();
};

// ---------- KİTAP TALEPLERİ ----------
async function loadBookRequests() {
var res = await supabaseClient
.from('book_requests')
.select('*')
.order('created_at', { ascending: false })
.limit(100);

if (res.error) {
document.getElementById('tabContent').innerHTML =
'<div class="error-msg">Hata: ' + escapeHtml(res.error.message) + '</div>';
return;
}

var reqs = res.data || [];

if (!reqs.length) {
document.getElementById('tabContent').innerHTML =
'<div class="section"><div class="empty"><span class="flower">❀</span>Henüz kitap talebi yok.</div></div>';
return;
}

var html = '<div class="section"><h2>Kitap Talepleri</h2>';
reqs.forEach(function(r) {
var status = r.status || 'pending';
var badgeClass = status === 'approved' ? 'badge-approved' :
status === 'rejected' ? 'badge-rejected' : 'badge-pending';
var badgeText = status === 'approved' ? 'Onaylı' :
status === 'rejected' ? 'Reddedilen' : 'Bekliyor';

html += '<div class="item">';
html += '<div class="item-header">';
html += '<div>';
html += '<div class="item-name">' + escapeHtml(r.title) + '</div>';
if (r.author) html += '<div class="item-username">' + escapeHtml(r.author) + '</div>';
html += '<div class="item-meta">' + timeAgo(r.created_at) + '</div>';
html += '</div>';
html += '<span class="badge ' + badgeClass + '">' + badgeText + '</span>';
html += '</div>';

if (r.note) {
html += '<div class="item-note">' + escapeHtml(r.note) + '</div>';
}

if (status === 'pending') {
html += '<div class="item-actions">';
html += '<button class="btn btn-approve" onclick="approveBookRequest(\'' + r.id + '\')">' + ICONS.check + ' Onayla</button>';
html += '<button class="btn btn-reject" onclick="rejectBookRequest(\'' + r.id + '\')">' + ICONS.x + ' Reddet</button>';
html += '</div>';
} else if (status === 'rejected') {
html += '<div class="item-actions">';
html += '<button class="btn btn-neutral" onclick="unrejectBookRequest(\'' + r.id + '\')">↩ Geri Al</button>';
html += '</div>';
}

html += '</div>';
});
html += '</div>';
document.getElementById('tabContent').innerHTML = html;
}

window.approveBookRequest = async function(id) {
var curRes = await supabaseClient.from('book_requests').select('title, author').eq('id', id).single();
if (curRes.error || !curRes.data) { toast('Talep bulunamadı', true); return; }
var newTitle = prompt('Kitap adı (düzenleyebilirsin):', curRes.data.title || '');
if (newTitle === null) return;
newTitle = newTitle.trim();
if (!newTitle) { toast('Kitap adı boş olamaz', true); return; }
var newAuthor = prompt('Yazar (düzenleyebilirsin):', curRes.data.author || '');
if (newAuthor === null) return;
var updRes = await supabaseClient.from('book_requests').update({ title: newTitle, author: (newAuthor || '').trim(), status: 'approved', reviewed_at: new Date().toISOString(), reviewed_by: currentUser.id }).eq('id', id);
if (updRes.error) { toast('Hata: ' + updRes.error.message, true); return; }
try {
var exRes = await supabaseClient.from('books').select('id').eq('title', newTitle).limit(1);
if (!exRes.data || !exRes.data.length) {
var insRes = await supabaseClient.from('books').insert([{ title: newTitle, author: (newAuthor || '').trim() || null }]);
if (insRes.error) { toast('Onaylandı ama kataloğa eklenemedi: ' + insRes.error.message, true); await updateCounts(); loadBookRequests(); return; }
toast('Onaylandı ve kataloğa eklendi');
} else {
toast('Onaylandı (katalogda zaten vardı)');
}
} catch (e) {
toast('Onaylandı ama katalog kontrolü başarısız', true);
}
await updateCounts();
loadBookRequests();
};

window.rejectBookRequest = async function(id) {
if (!confirm('Bu kitap talebini reddetmek istediğine emin misin?')) return;
var res = await supabaseClient.from('book_requests').update({ status: 'rejected', reviewed_at: new Date().toISOString(), reviewed_by: currentUser.id }).eq('id', id);
if (res.error) { toast('Hata: ' + res.error.message, true); return; }
toast('Talep reddedildi');
await updateCounts();
loadBookRequests();
};

window.unrejectBookRequest = async function(id) {
if (!confirm('Bu talebi tekrar inceleme sırasına almak istiyor musun?')) return;
var res = await supabaseClient.from('book_requests').update({ status: 'pending', reviewed_at: null, reviewed_by: null }).eq('id', id);
if (res.error) { toast('Hata: ' + res.error.message, true); return; }
toast('Talep bekleyenlere alındı');
await updateCounts();
loadBookRequests();
};

})();
